name: agents

# Enables gh-agents on this repo: PR review on `/oc review`, `/oc` fix, CI
# diagnosis. Reviews never start on their own.
# Onboarding checklist: https://github.com/heliowap/gh-agents#onboarding

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  workflow_run:
    # set this to your CI workflow names — the filter takes exact names and
    # `on:` can't read expressions, so this list is what decides when
    # ci-doctor wakes; keep it in sync with ci_workflows. Leaving 'ci' on a
    # repo whose CI has another name means ci-doctor silently never fires.
    workflows: ['ci']
    types: [completed]

# The reusable callee can only use what is granted here — this is the union
# of its three jobs' permissions.
permissions:
  actions: read
  contents: write
  pull-requests: write
  issues: write

jobs:
  agents:
    uses: heliowap/gh-agents/.github/workflows/agents.yml@v1
    # Only trusted PR commands enter concurrency. Otherwise an unrelated
    # comment can replace a pending /oc request; plain issues never run fix.
    # Reviews are manual: `/oc review` from any human in a private repo (only
    # people with access can comment there); every other /oc, and anything
    # in a public repo, needs OWNER/MEMBER/COLLABORATOR. Never a bot.
    if: >-
      github.event_name == 'workflow_run'
      || (
        ((github.event_name == 'issue_comment' && github.event.issue.pull_request)
          || github.event_name == 'pull_request_review_comment')
        && github.event.comment.user.type != 'Bot'
        && (contains(github.event.comment.body, '/oc') || contains(github.event.comment.body, '/opencode'))
        && (contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
          || (github.event.repository.private
            && (contains(github.event.comment.body, '/oc review') || contains(github.event.comment.body, '/opencode review'))))
      )
    # The caller job gates concurrency before invoking the callee; the callee
    # mirrors these lanes in a separate namespace. Group by trigger lane +
    # target here so a comment never cancels an in-flight review — one group
    # per PR let any comment kill it (intrador #1417).
    # `/oc review` comments take the review lane and every other /oc comment
    # the fix lane: a review never waits behind a fixer, and fixers for one
    # PR cannot push concurrently to its branch.
    # Keep lanes and target expression aligned with dogfood and callee;
    # scripts/tests/test_caller_workflows.py checks the relation.
    # for workflow_run the id is unique per triggering run — the group never
    # collides there; ci-doctor dedup comes from its marker comment.
    # Every declared event has a target; run_id isolates malformed payloads.
    concurrency:
      group: >-
        gh-agents-${{ (github.event_name == 'issue_comment' || github.event_name == 'pull_request_review_comment') && (contains(github.event.comment.body, '/oc review') || contains(github.event.comment.body, '/opencode review')) && 'review' || (github.event_name == 'issue_comment' || github.event_name == 'pull_request_review_comment') && 'fix' || github.event_name }}-${{ github.event.pull_request.number
        || github.event.issue.number || github.event.workflow_run.id
        || github.run_id }}
      # Comments queue: a new /oc request must not interrupt a review or a
      # fixer already running.
      cancel-in-progress: false
    # `inherit` only passes secrets to a reusable workflow of the same owner
    # (org or enterprise). Repos outside `heliowap` map them explicitly — with
    # `inherit` the key arrives empty and the preflight fails:
    #   secrets:
    #     OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
    #     FIREWORKS_API_KEY: ${{ secrets.FIREWORKS_API_KEY }}
    secrets: inherit
    with:
      # ChatGPT login on the runner host (vars.AGENT_OPENCODE_AUTH)
      model: openai/gpt-6-luna-fast#xhigh
      model_fallbacks: opencode/space-bunny-free
